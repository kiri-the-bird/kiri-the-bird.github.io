<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightlight Sketches Gallery</title>
    <style>
        body {
            background-color: #1a1829;
            color: #e2def5;
            font-family: sans-serif;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            color: #d4afe8;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a8a0d2;
            font-style: italic;
        }
        .sketch-box {
            background: #252338;
            border: 1px solid #3f3b60;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 500px;
            margin: 2rem auto;
        }
    </style>
</head>
<body>
    <h1>Nightlight Sketches</h1>
    <p>A quiet place for gentle night drawings and heron roost stories.</p>
    <div class="sketch-box">
        <p>✨ "The drizzle falls softly over the quiet woods, and the herons sleep in the tall trees." ✨</p>
    </div>
</body>
</html>
